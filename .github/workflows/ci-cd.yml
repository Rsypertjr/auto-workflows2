name: Production Automation & Localhost Deployment Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- 1. ASYNCHRONOUS BACKEND VALIDATION JOB ---
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Source Code Tree
        uses: actions/checkout@v4

      - name: Provision Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Architecture Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Enforce Code Quality (Black & Flake8)
        run: |
          pip install black flake8
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Automated Test Suites (PyTest)
        run: |
          pytest --cov=app tests/

  # --- 2. ASYNCHRONOUS FRONTEND VALIDATION JOB ---
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Source Code Tree
        uses: actions/checkout@v4

      - name: Provision Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Sync Structural Dependencies
        run: npm ci

      - name: Enforce Code Formatting Constraints (ESLint)
        run: npm run lint

      - name: Enforce Strict Compilation Mappings (TypeScript)
        run: npx tsc --noEmit

      - name: Execute Interface Testing Suite (Vitest)
        run: npm run test

      - name: Verify Isolated Compilation Build Execution
        run: npm run build

  # --- 3. ATOMIC DEPLOYMENT JOB TO LOCALHOST ---
  deploy:
    needs: [backend-ci, frontend-ci]
    # Restricts automatic execution to code merged specifically via pushes into main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted  # 🚀 CRITICAL: Directs GitHub to send commands straight to your laptop's local terminal agent
    steps:
      - name: Synchronize Local Workspace Files
        uses: actions/checkout@v4

      - name: Hot-Swap Active Docker Container Cluster Layout
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          echo "📥 GitHub validation complete. Commencing safe zero-downtime rollover..."
          
          # Executes your existing compose file parameters directly on your machine terminal
          docker compose -f docker-compose.prod.yml up -d --build --force-recreate
          
          echo "✅ Localhost Cluster Synced Successfully!"